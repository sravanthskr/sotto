<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="RealAssistant mark" fill="none">
  <!-- RealAssistant — bare mark (thread + point), currentColor.
       Use for wordmark lockups, favicon on shaped backgrounds, UI spots.
       No tile: the mark is complete on its own. -->
  <line x1="64" y1="128" x2="192" y2="128" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="26" fill="currentColor"/>
</svg>
